name: Quality and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /Irina-Nails
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v5

      - name: Checkout current TANEM master template
        uses: actions/checkout@v5
        with:
          repository: ichAEY/Shablon-For-Only-Masters
          ref: main
          path: template

      - name: Preserve existing client photos
        run: |
          mkdir -p template/public/assets/client
          cp -a assets/. template/public/assets/client/

      - name: Convert legacy client data to current template
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const old = (await import(pathToFileURL(process.cwd() + '/site-data.mjs'))).default;
          const base = `\${process.env.NEXT_PUBLIC_BASE_PATH || ""}`;
          const fixImage = (p) => p ? `\${base}/assets/client/\${p.split('/').pop()}` : "";
          const groups = [];
          if (old.services?.manicure?.length) groups.push({id:"manicure",label:"Маникюр",services:old.services.manicure});
          if (old.services?.pedicure?.length) groups.push({id:"pedicure",label:"Педикюр",services:old.services.pedicure});
          const channels = [];
          if (old.contacts?.personalTelegramUrl) channels.push({type:"telegram",label:"Telegram",url:old.contacts.personalTelegramUrl});
          if (old.extraContacts?.whatsappUrl) channels.push({type:"whatsapp",label:"WhatsApp",url:old.extraContacts.whatsappUrl});
          if (old.extraContacts?.vkUrl) channels.push({type:"vk",label:"VK",url:old.extraContacts.vkUrl});
          const data = {
            basePath: base,
            template:{specialty:"nails",bookingProvider:"",reviewSource:""},
            brand:old.brand,
            master:{
              ...old.master,
              heroTitle:"",
              heroEmphasis:"эксперт по маникюру и педикюру",
              heroCaption:old.brand?.subtitle || "Мастер маникюра и педикюра",
              imageAlt:old.master?.profession || "мастер маникюра и педикюра",
              visitMotto:"",
              experienceYears:old.master?.experienceYears ? Number(old.master.experienceYears) : null,
              aboutLead:"",
              aboutParagraphs:[],
              skills:[]
            },
            location:{
              ...old.location,
              country:"Россия",countryCode:"RU",timeZone:"Europe/Moscow",
              openTime:(old.location?.schedule?.match(/(\d{2}:\d{2})/)||[])[1]||"10:00",
              closeTime:(old.location?.schedule?.match(/(\d{2}:\d{2})[^\d]+(\d{2}:\d{2})/)||[])[2]||"22:00"
            },
            contacts:{phoneDisplay:old.contacts?.phoneDisplay||"",phoneHref:old.contacts?.phoneHref||"",channels,messenger:null},
            links:{
              bookingUrl:old.links?.bookingUrl||"",reviewsUrl:old.links?.reviewsUrl||"",mapUrl:old.links?.mapUrl||"",
              routeUrl:old.links?.routeUrl||old.links?.mapUrl||"",mobileMapEmbedUrl:"about:blank",desktopMapEmbedUrl:"about:blank",
              yandexMapHrefMatch:old.links?.yandexMapHrefMatch||""
            },
            reputation:old.reputation||{rating:"",reviewCount:""},
            images:{
              logo:"",portrait:fixImage(old.images?.portrait),portraitDesktop:fixImage(old.images?.portrait),
              about:fixImage(old.images?.about),favicon:`\${base}/favicon-source.png`,
              heroDecoration:`\${base}/assets/template/hair-tools.png`,
              beforeAfter:(old.images?.beforeAfter||[]).map(x=>({...x,src:fixImage(x.src)})),
              gallery:(old.images?.gallery||[]).map(x=>({...x,src:fixImage(x.src)}))
            },
            services:{groups},
            i18n:{localLocale:"ru",locales:[{code:"ru",label:"RU"},{code:"en",label:"EN"}],translations:{en:{}}},
            reviews:[],
            promotions:old.promotions||[],
            amenities:[],
            seo:{siteUrl:`https://ichaey.github.io/Irina-Nails/`,title:old.seo?.title||old.brand?.name||"",description:old.seo?.description||"",keywords:old.seo?.keywords||[],locale:"ru_RU"},
            analytics:old.analytics||{yandexMetrikaId:""}
          };
          const rules = await import(pathToFileURL(process.cwd() + '/template/template-rules.mjs'));
          const first = String(data.master?.name || '').trim().split(/\s+/)[0] || '';
          const about = [
            `Я ${first} — эксперт по маникюру и педикюру.`,
            "Выполняю маникюр и педикюр, наращивание и коррекцию ногтей.",
            "Работаю со стерильными инструментами и уделяю внимание аккуратности, форме и качеству результата.",
            "Маникюр и педикюр","Наращивание и коррекция","Стерильные инструменты"
          ];
          data.i18n.locales=[{code:"ru",label:"RU"},{code:"en",label:"EN"}];
          data.i18n.translations={en:{}};
          const temp={...data,master:{...data.master,aboutLead:about[0],aboutParagraphs:about.slice(1,3),skills:about.slice(3)}};
          for (const key of rules.clientTranslationKeys(temp)) data.i18n.translations.en[key]=key;
          fs.writeFileSync('template/site-data.mjs', 'export default ' + JSON.stringify(data,null,2) + ';\n');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Build current template
        working-directory: template
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: template/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
