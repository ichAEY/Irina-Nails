name: Deploy TANEM site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customer data
        uses: actions/checkout@v4

      - name: Checkout exact TANEM template
        run: |
          git clone https://github.com/ichAEY/claytone-current.git template
          git -C template checkout 89647b7d61ebcdfd43f74de2afa4d81b3dfb0194

      - name: Apply customer data and assets
        run: |
          cp site-data.mjs template/site-data.mjs
          cp scripts/customize-site.mjs template/scripts/customize-site.mjs
          cp favicon.svg template/public/favicon.svg
          printf '' > template/public/noop.js
          mkdir -p template/public/assets
          unzip -q assets.zip -d template/public/assets

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install exact template dependencies
        working-directory: template
        run: npm ci

      - name: Generate customer site
        working-directory: template
        run: |
          node scripts/generate-site.mjs
          node scripts/customize-site.mjs
          rm -rf public/_next

      - name: Ignore hosting-only TypeScript files
        working-directory: template
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.exclude = [
            ...(config.exclude || []),
            'db/**',
            'worker/**',
            'examples/**',
            'build/**',
            'drizzle/**',
            'drizzle.config.ts',
            'vite.config.ts'
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build static site
        working-directory: template
        run: npx next build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
